{% extends "index.html" %}
{% block content %}
  <div class="row my-4">
    <div class="col-md-4">
      <img src="{{ movie.poster }}" class="img-fluid rounded" alt="{{ movie.title }}">
    </div>
    <div class="col-md-8">
      <h2>{{ movie.title }}</h2>
      <p class="text-muted">{{ movie.overview }}</p>
      <a href="{{ url_for('homepage') }}" class="btn btn-secondary">Powrót</a>
    </div>
  </div>
{% endblock %}
