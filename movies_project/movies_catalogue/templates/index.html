<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bilbioteka filmów</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      /* Stylizacja zgodna ze screenem */
      body { font-family: "Segoe UI", Roboto, Arial, sans-serif; background:#f8f9fa; }
      .site-heading { padding: 4rem 0 2rem 0; text-align:center; }
      .site-heading h1 { font-size:2.5rem; margin-bottom:0.5rem; font-weight:700; }
      .site-heading p { font-size:1.125rem; color:#6c757d; margin-bottom:0; }
      .card-img-top { width:100%; height: auto; display:block; }
      .card { border: none; }
      .card .card-body { padding: 1rem; }
      .card .card-footer { background: transparent; border-top: none; padding: 0 1rem 1rem 1rem; }
      .btn-details { min-width: 100px; }
      footer { padding:2rem 0; text-align:center; color:#6c757d; }
      @media (min-width: 992px) {
        .cards-row { gap: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">Start Bootstrap</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">About</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="mt-5">
      <div class="container">
        <small>© Twoja Biblioteka Filmów</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
